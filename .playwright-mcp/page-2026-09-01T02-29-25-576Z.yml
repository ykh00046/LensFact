    - generic [ref=f33e11]:
      - paragraph [ref=f33e12]: 소개 · 최종 수정 2026.08.28
      - heading "LensFact 소개" [level=1] [ref=f33e13]
      - paragraph [ref=f33e14]: LensFact 렌즈팩트는 콘택트렌즈 포장과 공식 자료에 적힌 표기를 공개된 원문 출처와 함께 확인하는 정보 사이트입니다.
    - article [ref=f33e17]:
      - heading "이 사이트가 하는 일" [level=2] [ref=f33e18]
      - list [ref=f33e19]:
        - listitem [ref=f33e20]: BC, DIA, 함수율, 재질, Dk/t, 중심두께, 교체주기, UV 표기 같은 공개 사양을 같은 항목으로 정리합니다.
        - listitem [ref=f33e21]: 모든 값에 출처 문서, 원문 표기, 측정·확인 조건, 확인일을 함께 남깁니다.
        - listitem [ref=f33e22]: 공식 자료끼리 값이 다르면 한쪽을 고르지 않고 두 값을 함께 보여줍니다.
        - listitem [ref=f33e23]: 공개 자료에서 확인하지 못한 값은 확인되지 않음으로 남깁니다.
        - listitem [ref=f33e24]: 숫자 하나로 결론을 내릴 수 없는 지점을 편집 해설로 구분해 설명합니다.
      - heading "이 사이트가 하지 않는 일" [level=2] [ref=f33e25]
      - list [ref=f33e26]:
        - listitem [ref=f33e27]: 제품을 추천하거나 순위·점수를 매기지 않습니다.
        - listitem [ref=f33e28]: 도수를 처방하거나 개인의 적합성을 판정하지 않습니다.
        - listitem [ref=f33e29]: 증상을 진단하거나 치료·안전을 보장하지 않습니다.
        - listitem [ref=f33e30]: 렌즈를 판매하거나 구매·예약·제휴 링크를 제공하지 않습니다.
      - paragraph [ref=f33e31]: 최종 도수, 피팅, 착용방식은 안경사 또는 안과 전문인에게 확인해야 합니다. 이 사이트의 설명은 그 판단을 대신하지 않습니다.
      - heading "독립성 원칙" [level=2] [ref=f33e32]
      - paragraph [ref=f33e33]: 이 사이트는 광고, 후원, 제휴, 제품 제공, 원고 제공 또는 그 밖의 대가 관계 없이 운영됩니다. 모든 제품은 같은 기준으로 공개된 공식 자료만 확인하며 제조사의 사전 검토를 받지 않습니다.
      - heading "의료기기 광고가 아닙니다" [level=2] [ref=f33e34]
      - paragraph [ref=f33e35]: 이 사이트는 의료기기 광고가 아니며 특정 제품의 구매나 사용을 권유하지 않습니다. 한국 허가번호(수입허가 수허·제조허가 제허)는 공개된 식별 정보로서, 화면에 표시된 제품이 어떤 공식 자료와 연결되는지 확인할 수 있도록 그대로 옮겨 적은 것입니다. 허가번호 표시는 성능이나 안전성에 대한 보증이 아니며, 의료기기 광고 사전심의 번호와도 다른 정보입니다.
